name: Create and Publish Docker Image

on:
  push:
    branches: ['main', ] 
  pull_request:
    branches: ['main', ]
  # Add manual trigger so you can run this workflow from Actions -> Run workflow
  workflow_dispatch:
    
env:
  REGISTRY: ghcr.io
  # github.repository ist "User/Repo", IMAGE_NAME muss aber lowercase sein
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # WICHTIG: Erlaubt das Schreiben in die Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub generiert diesen Token automatisch

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Hier wird nach dem Dockerfile im Hauptverzeichnis gesucht
          file: ./Dockerfile 
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
          